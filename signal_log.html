<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New OC Signals</title>
<style>
:root{--bg:#fff;--fg:#1a1a2e;--mut:#667;--card:#f4f5f8;--line:#dde0e8;--acc:#1f3a93}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161f;--fg:#e8eaf2;--mut:#99a;--card:#1d2030;--line:#2a2e42;--acc:#7f9cf5}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif;max-width:1000px;margin:auto}
table{border-collapse:collapse;width:100%;font-size:.88em}
td,th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
a{color:var(--acc)}
</style>
</head>
<body>
<!--main-dashboard-link--><div id="main-dashboard-link" data-mode="bar" style="box-sizing:border-box;width:100%;padding:7px 14px;background:#0f172a;font:600 12px/1.3 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:left;margin:-16px -16px 10px"><a href="https://aps-source.github.io/" style="color:#e2e8f0;text-decoration:none">&#9666; Main dashboard</a></div><!--/main-dashboard-link-->
<h1 style="font-size:1.2em">New OC — Strategy Signal History <a href="index.html" style="font-size:.7em;margin-left:12px">◂ live</a></h1>
<p style="color:var(--mut);font-size:.85em">Every setup stage / approval / rejection the engine logged (last 500). Codes per STRATEGY_SPEC.md. Refreshes every minute.</p>
<div id="t">loading…</div>
<script>
const esc=s=>String(s??"—").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function load(){fetch("signal_log.json?t="+Date.now()).then(r=>r.json()).then(d=>{
 const rows=(d.decisions||[]).slice().reverse();
 t.innerHTML=`<div style="color:var(--mut);font-size:.8em">generated ${esc(d.generated)}</div>`+
  (!rows.length?"<p>No signals logged yet — the engine writes a row for every setup stage, approval and rejection once they occur.</p>":
  "<table><tr><th>Time</th><th>Variant</th><th>Setup</th><th>Stage</th><th>Code</th><th>Detail</th></tr>"+
  rows.map(r=>`<tr><td>${esc(r.time)}</td><td>${esc(r.variant)}</td><td>${esc(r.setup_id)}</td><td>${esc(r.stage)}</td><td><b>${esc(r.code)}</b></td><td style="color:var(--mut)">${esc(r.detail)}</td></tr>`).join("")+"</table>");
}).catch(()=>{t.innerHTML="signal_log.json not available yet"});}
load();setInterval(load,60000);
</script>
</body>
</html>
